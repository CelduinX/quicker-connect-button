plugins {
    id "com.github.johnrengelman.shadow" version "8.1.1"
    id "me.shedaniel.unified-publishing" version "0.1.+"
}

base {
    archivesName = "quickerconnectbutton-fabric"
}

dependencies {
    implementation libs.fabric.loader
    implementation libs.fabric.api
    implementation libs.architectury.fabric
    runtimeOnly libs.modmenu
    implementation libs.jamlib.fabric

}

sourceSets {
    main {
        java.srcDir project.file("../common/src/main/java")
        resources.srcDir project.file("../common/src/main/resources")
    }
}

if (System.getenv("CURSEFORGE_API_KEY") != null && System.getenv("MODRINTH_API_KEY") != null) {
    unifiedPublishing {
        project {
            displayName = "V${project.version} (Fabric ${project.minecraft_version})"
            changelog = rootProject.file("CHANGELOG.md").text
            releaseType = project.version.contains("beta") ? "beta" : "release"
            gameVersions = [project.minecraft_version]
            gameLoaders = ["fabric"]

            mainPublication tasks.shadowJar

            relations {
                depends {
                    curseforge = "fabric-api"
                    modrinth = "fabric-api"
                }

                depends {
                    curseforge = "architectury-api"
                    modrinth = "architectury-api"
                }

                depends {
                    curseforge = "jamlib"
                    modrinth = "jamlib"
                }
            }

            curseforge {
                token = System.getenv("CURSEFORGE_API_KEY")
                id = "898092"
            }

            modrinth {
                token = System.getenv("MODRINTH_API_KEY")
                id = "1SruaFxM"
            }
        }
    }
}

processResources {
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "fabric_loader_version": libs.versions.fabric.loader.get(),
                "fabric_api_version": libs.versions.fabric.api.get(),
                "architectury_version": libs.versions.architectury.get(),
                "jamlib_version": libs.versions.jamlib.get()
    }

    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "fabric_loader_version", libs.versions.fabric.loader.get()
    inputs.property "fabric_api_version", libs.versions.fabric.api.get()
    inputs.property "architectury_version", libs.versions.architectury.get()
    inputs.property "jamlib_version", libs.versions.jamlib.get()
}

shadowJar {
    archiveClassifier = ""
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
